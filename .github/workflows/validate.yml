name: WinScope Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Windows PowerShell version
        shell: powershell
        run: $PSVersionTable | Format-List | Out-String | Write-Host

      - name: Run WinScope validation suite
        shell: powershell
        run: .\Tests\Run-WinScopeValidation.ps1
