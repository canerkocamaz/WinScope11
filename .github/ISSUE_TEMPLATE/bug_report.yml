name: Bug report
description: Report a reproducible WinScope problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please sanitize host names, user names, domains, paths, and report content before posting.
  - type: input
    id: version
    attributes:
      label: WinScope version
      placeholder: "3.2.8"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version/build
    validations:
      required: true
  - type: input
    id: powershell
    attributes:
      label: Windows PowerShell version
    validations:
      required: true
  - type: input
    id: modules
    attributes:
      label: Affected module ID(s)
      placeholder: "16 or 1-20"
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / sanitized error output
      render: text
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed the content above and removed sensitive machine/user information.
          required: true
