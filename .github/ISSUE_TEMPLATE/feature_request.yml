name: Feature request
description: Suggest a WinScope enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What audit, reporting, or workflow problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Module / finding
        - Reporting
        - Interactive UI
        - PowerShell CLI
        - Validation / QA
        - v4 executable launcher
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safe Audit compatibility
      options:
        - label: The proposal can remain report-only and does not require destructive remediation.
          required: true
